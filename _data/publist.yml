- title: 'FigCLIP: Fine-Grained CLIP Adaptation via Densely Annotated Videos'
  image: srl_clip.png
  description: Addressed the lack of fine-grained and syntactic information in CLIP’s representations by adapting CLIP on holistic, multidimensional, and densely annotated video-text data using lightweight adaptation strategy with LoRA adapters.
  authors: <b>Darshan Singh</b>, <a href="https://zeeshank95.github.io/">Zeeshan Khan</a>, <a href="https://makarandtapaswi.github.io">Makarand Tapaswi</a>
  # venue: <i>In Neural Information Processing Systems (<b>NeurIPS</b>), 2022</i>
  number_link: 1
  link1:
    url: https://arxiv.org/abs/2401.07669/
    display: Paper (under review)

- title: 'Unsupervised Audio Visual Lecture Segmentation'
  image: avlectures.png
  description: Proposed video lecture segmentation that splits lectures into bite-sized topics. Approached this problem by first learning the lecture-clip representations by leveraging visual, textual, and OCR cues using a pretext self-supervised task of matching lecture narrations with temporally aligned visual content. Used these learned representations to temporally segment the lectures using an algorithm called TW-FINCH. Introduced a new dataset, AVLectures, a large-scale dataset consisting of 86 courses with over 2,350 lectures covering various STEM subjects from MIT-OpenCourseWare, which we used for pre-training, fine-tuning, and evaluating the segmentation performance.
  authors: <b>Darshan Singh</b>, Anchit Gupta, <a href="https://faculty.iiit.ac.in/~jawahar/index.html"> C.V. Jawahar </a> and <a href="https://makarandtapaswi.github.io">Makarand Tapaswi</a>
  venue: <i>Winter Conference on Applications of Computer Vision (<b>WACV</b>), 2023</i>
  number_link: 2
