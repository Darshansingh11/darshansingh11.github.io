- title: Detect, Describe, Discriminate - Moving Beyond VQA for MLLM Evaluation
  image: d3.png
  description: <b>TL;DR</b> It is easier for MLLMs to select an answer from multiple choices during VQA than to generate it independently.
   We evaluate MLLMs visual capabilities through self-retrieval within highly similar image pairs, revealing that current models struggle to identify fine-grained visual differences, with open-source models failing to outperform random guess.
  authors: <a href="https://manugaurdl.github.io/">Manu Gaur</a>, <b>Darshan Singh S</b>, <a href="https://makarandtapaswi.github.io">Makarand Tapaswi</a>
