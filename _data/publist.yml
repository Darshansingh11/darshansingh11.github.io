- title: No Detail Left Behind - Revisiting Self-Retrieval for Fine-Grained Image Captioning
  image: ndlb.png
  description: A findings rich paper that systematically improves captioning systems across all fronts- Data, Training, Evaluation. We design- (1) a post-training recipe for self-retrieval finetuning with REINFORCE, and (2) a synthetic framework for visually boosting captioning datasets. Jointly they enable captioners to generate fine-grained, succinct descriptions while reducing hallucinations. Using our training recipe, ClipCap, a 200M param simplication of modern MLLMs, outperforms sota open-source MLLMs on fine-grained visual discrimination.
  authors: <a href="https://manugaurdl.github.io/">Manu Gaur</a>, <b>Darshan Singh S</b>, <a href="https://makarandtapaswi.github.io">Makarand Tapaswi</a>
