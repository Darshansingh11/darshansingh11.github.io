- title: 'Rethinking Cross-lingual Gaps from a Statistical Viewpoint'
  image: cross_lingual.png
  description: We propose an alternative view of the cross-lingual gap in LLMs, hypothesizing that the variance of responses in the target language (not just differences in latent representations) to be the primary cause behind the drop in performance. We are the first to formalize this gap using bias-variance decomposition, providing extensive experimental evidence to support our hypothesis. Our key finding is that this variance-driven gap can be significantly reduced; we demonstrate that simple inference-time interventions, including a specific prompt instruction to control variance, can improve target language accuracy by 20-25%.
  authors: <a href="https://vihari.github.io/">Vihari Piratla</a>, Purvam Jain, <b>Darshan Singh S</b>, <a href="https://trevorcohn.github.io/">Trevor Cohn</a>, <a href="https://parthatalukdar.github.io/">Partha Talukdar</a>
  number_link: 1
  link1:
    url: https://arxiv.org/abs/2510.15551
    display: Paper (under review)

- title: 'VELOCITI: Benchmarking Video-Language Compositional Reasoning with Strict Entailment'
  image: velociti.png
  description: We propose VELOCITI, a new benchmark to evaluate how well Video-LLMs understand compositional reasoning. We introduce StrictVLE (Strict Video-Language Entailment), a new evaluation method that offers a stricter test by requiring models to correctly classify both positive and negative captions. Our key finding is that even state-of-the-art models like Gemini 1.5 Pro (49.3%) perform far below human accuracy (93.0%), showing they significantly struggle to associate agents with their actions, which is one of the most fundamental reasoning skills.
  authors: Darshana S<sup>*</sup>, Varun Gupta<sup>*</sup>, <b>Darshan Singh S</b><sup>*</sup>, <a href="https://zeeshank95.github.io/">Zeeshan Khan</a>, <a href="https://vineet-gandhi.github.io/">Vineet Gandhi</a>, <a href="https://makarandtapaswi.github.io">Makarand Tapaswi</a>
  venue: <i>In Conference on Computer Vision and Pattern Recognition (<b>CVPR</b>), 2025</i>
